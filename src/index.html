<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>FusaRoute — rutas de buses de Fusagasugá</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- El navegador de escritorio guarda el favicon por URL durante semanas, y el del logo de Angular
       quedo cacheado en las PC. El ?v= fuerza una URL nueva; subirlo si el icono vuelve a cambiar. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png?v=2">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=2" sizes="48x48">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png?v=2">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#4F46E5">
  <meta name="description" content="Consulta las rutas de transporte público de Fusagasugá: recorrido, barrios por los que pasa, tarifa y aviso de congestión.">

  <!-- FusaRoute Branding Typography -->
  <!--
    SCRUM-127/136 (RNF-01): las dos fuentes de marca se sirven DESDE ESTE ORIGEN, no
    desde fonts.gstatic.com. La razon es medida, no estetica: cada origen externo
    cuesta DNS + TCP + TLS antes del primer byte, y con la latencia de Slow 4G simulado
    (562 ms por viaje) esa apertura de conexion sola valia cerca de 1,7 s. El archivo
    de la fuente llegaba despues del primer pintado, el titulo se re-dibujaba con otra
    metrica y el LCP se corria a ese segundo dibujado: el presupuesto de 2,5 s se
    reventaba por la conexion, no por el peso de la app.

    Sirviendolas de aqui la conexion ya esta abierta (es la misma del index.html) y el
    preload las pide durante el parseo del documento, asi que llegan junto con el JS y
    el titulo se pinta con la tipografia definitiva de una sola vez.

    Son los subconjuntos latinos variables (un archivo por familia cubre todos los
    pesos: 400-700 y 500-700). No cubren el rango de los simbolos ★/☆ del boton de
    favorito — esos ya caian en la fuente del sistema antes y siguen igual.
    Para actualizarlas: pedir la hoja css2 de Google con un User-Agent de Chrome y
    bajar la URL del bloque cuyo unicode-range empieza en U+0000-00FF.
  -->
  <link rel="preload" href="fonts/space-grotesk-latin-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/plus-jakarta-sans-latin-variable.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face {
      font-family: 'Plus Jakarta Sans';
      font-style: normal;
      font-weight: 400 700;
      font-display: swap;
      src: url(fonts/plus-jakarta-sans-latin-variable.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
    @font-face {
      font-family: 'Space Grotesk';
      font-style: normal;
      font-weight: 500 700;
      font-display: swap;
      src: url(fonts/space-grotesk-latin-variable.woff2) format('woff2');
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }
  </style>
</head>
<body>
  <app-root></app-root>
  <noscript>Esta aplicación necesita JavaScript para funcionar. Actívalo en tu navegador y vuelve a cargar la página.</noscript>
</body>
</html>
