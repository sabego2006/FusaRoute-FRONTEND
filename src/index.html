<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>FusaRoute — rutas de buses de Fusagasugá</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- El navegador de escritorio guarda el favicon por URL durante semanas, y el del logo de Angular
       quedo cacheado en las PC. El ?v= fuerza una URL nueva; subirlo si el icono vuelve a cambiar. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192x192.png?v=2">
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=2" sizes="48x48">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png?v=2">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#4F46E5">
  <meta name="description" content="Consulta las rutas de transporte público de Fusagasugá: recorrido, barrios por los que pasa, tarifa y aviso de congestión.">

  <!-- FusaRoute Branding Typography -->
  <!-- SCRUM-127/136: la hoja de estilos de Google Fonts es un recurso externo que, como
       <link rel="stylesheet"> normal, bloquea el render hasta que termina de ir y volver
       (y bajo Slow 4G simulado eso solo ya costaba ~1.5s). El patron preload+onload la
       descarga con prioridad alta sin bloquear el primer pintado: la pagina pinta con la
       fuente de sistema y cambia a la de marca cuando llega, que es lo que display=swap
       ya hacia para el archivo de la fuente — esto hace lo mismo para su hoja de estilos. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap"></noscript>
</head>
<body>
  <app-root></app-root>
  <noscript>Esta aplicación necesita JavaScript para funcionar. Actívalo en tu navegador y vuelve a cargar la página.</noscript>
</body>
</html>
