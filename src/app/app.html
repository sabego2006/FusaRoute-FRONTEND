<app-header />
<app-suspension-notices />
<main class="fr-shell">
  <!--
    Pantalla que no alcanzó a cargarse (T15). Antes el router abortaba la navegación y
    la vista quedaba en blanco: ni lista, ni esqueleto, ni aviso. Esto es la salida.
  -->
  @if (failedUrl()) {
    @if (isOnline()) {
      <div class="fr-suta-estado fr-suta-estado--error" role="alert">
        <img src="assets/mascot/suta-de-pie.webp" alt="" aria-hidden="true"
             class="fr-suta fr-suta-sm" width="48" height="48" loading="lazy" decoding="async">
        <div>
          <p><strong style="color: var(--rojo-texto);">Qué falla:</strong>
            esta pantalla no alcanzó a cargar completa.</p>
          <button type="button" class="fr-btn" (click)="reload()">Reintentar</button>
        </div>
      </div>
    } @else {
      <div class="fr-suta-estado" role="status">
        <img src="assets/mascot/suta-pointing.webp" alt="" aria-hidden="true"
             class="fr-suta fr-suta-sm" width="48" height="48" loading="lazy" decoding="async">
        <div>
          <p><strong>Se le fue el internet a mitad de camino.</strong> Apenas vuelva cargamos esta pantalla solos.</p>
          <button type="button" class="fr-btn" (click)="reload()">Reintentar</button>
        </div>
      </div>
    }
  }
  <router-outlet />
</main>
<footer class="fr-pie" aria-label="Pie de página">
  <div class="fr-franja-arhuaca" aria-hidden="true"></div>
  <p class="fr-pie__frase"><span>Hecho en Fusa, para que nadie vuelva a perderse.</span></p>
  <svg class="fr-pie__sello" viewBox="0 0 140 140" width="126" height="126" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <circle cx="70" cy="70" r="64" fill="#d9f99d" stroke="#0a0a0c" stroke-width="5"/><circle cx="70" cy="70" r="48" stroke="#0a0a0c" stroke-dasharray="3 6" stroke-width="3"/><path id="fr-sello-ruta" fill="none" d="M16 70a54 54 0 1 1 108 0 54 54 0 1 1-108 0"/><text fill="#0a0a0c" font-family="Bowlby One, Arial Black, sans-serif" font-size="15"  letter-spacing="2"><textPath href="#fr-sello-ruta">HECHO EN FUSA • HECHO EN FUSA •</textPath></text><path fill="#0a0a0c" d="M44 78h52V64H44Z"/><path fill="#ffd600" stroke="#0a0a0c" stroke-width="3" d="m52 64 8-12h20l8 12"/><circle cx="56" cy="80" r="6" fill="#fff" stroke="#0a0a0c" stroke-width="3"/><circle cx="84" cy="80" r="6" fill="#fff" stroke="#0a0a0c" stroke-width="3"/>
  </svg>
</footer>
<app-bottom-nav />
<app-toast />
