# Analisis estatico del frontend (SCRUM-182, RNF-05). Da soporte a ISO/IEC 25010.
#
# sonar.token y sonar.host.url NO se fijan aqui: viajan por secret del CI. El token
# nunca se commitea, y la URL puede cambiar si el hosting cambia.

sonar.projectKey=sabego2006_FusaRoute-FRONTEND
sonar.projectName=FusaRoute Frontend

# Obligatorio en SonarCloud, que es donde corre el analisis del CI. Tiene que
# coincidir EXACTAMENTE con la organizacion que quede creada al importar el repo:
# si no coincide, el analisis falla con "project not found". Confirmarlo en la URL
# del dashboard despues de importar, no asumirlo.
#
# La instancia Docker local ignora esta propiedad; alli lo que manda es projectKey.
sonar.organization=sabego2006

# En Angular el codigo y los tests viven mezclados bajo src/, asi que ambos apuntan
# ahi y lo que los separa es test.inclusions. Los .spec.ts salen de sources (van
# como tests) pero siguen indexandose: Sonar tambien revisa la calidad de los tests.
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/*.spec.ts,src/main.ts,src/environments/**

# Ruta REAL del reporte de Vitest. El builder @angular/build:unit-test lo escribe
# bajo un subdirectorio con el nombre del proyecto, no en coverage/lcov.info como
# haria vitest suelto. Si esta ruta queda mal, Sonar no falla: reporta 0% de
# cobertura en silencio, que es peor.
sonar.javascript.lcov.reportPaths=coverage/fusaroute-frontend/lcov.info

# Lo mismo que se excluye del reporte de cobertura en angular.json, para que no
# aparezcan como "0% cubierto" archivos que a proposito no se prueban.
sonar.coverage.exclusions=src/main.ts,src/environments/**,**/*.spec.ts

sonar.sourceEncoding=UTF-8
