name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Secret de SonarCloud (SCRUM-182). Sin el token el paso de analisis
      # queda SKIPPED, no FAILED: asi el CI no se enrojece antes de que el
      # admin importe el repo y guarde el secret. Con el token presente el
      # paso corre y un fallo del scanner tumba el CI. El host ya no es un
      # secret: es siempre https://sonarcloud.io (ver el paso de analisis).
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        # Sonar usa el historial para el blame y para decidir que es codigo
        # nuevo; sin fetch-depth 0 las fechas de autoria quedan vacias.
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npx ng build

      - name: Test con cobertura
        # Genera coverage/fusaroute-frontend/lcov.info, que Sonar ingiere abajo
        # (la ruta esta en sonar-project.properties). Reemplaza al 'ng test'
        # pelado: la cobertura es parte de lo que se reporta en cada PR.
        run: npm run test:ci

      - name: Analisis SonarCloud
        # Guard: sin token el paso queda SKIPPED (ver env del job). Con
        # token el paso es bloqueante: un fallo del scanner tumba el CI.
        # El host va explicito y no por secret: es siempre el mismo, y
        # dejarlo en un secret vacio apagaria el analisis en silencio.
        # El Quality Gate es informativo por ahora — no se espera su
        # resultado, asi que un gate rojo no bloquea el merge. Cuando el
        # equipo acuerde umbrales se agrega sonar.qualitygate.wait=true.
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  lighthouse:
    # RNF-01 (SCRUM-127): LCP < 2.5s en la pantalla de resultado de busqueda
    # (/rutas/buscar), medido con Lighthouse CI mobile Slow 4G. Corre despues del job
    # de build-and-test para no gastar el runner de Chrome si el build/test ya fallo.
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build de produccion
        # El budget de bundle inicial (angular.json, "initial": maximumError 1MB) se
        # verifica aqui mismo: ng build falla si el bundle inicial lo excede.
        run: npx ng build

      - name: Lighthouse CI
        run: npx lhci autorun
